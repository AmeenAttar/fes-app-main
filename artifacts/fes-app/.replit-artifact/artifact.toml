kind = "mobile"
previewPath = "/"
title = "Cleveland FES Center"
version = "1.0.0"
id = "artifacts/fes-app"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 21922

[services.development]
run = "pnpm --filter @workspace/fes-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fes-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/fes-app", "run", "serve" ]

[services.env]
PORT = "21922"
BASE_PATH = "/"
